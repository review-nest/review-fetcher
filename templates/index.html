<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews Nest</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:#f8fafc;margin:0;padding:30px}
.container{max-width:1000px;margin:auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
h1{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
input,select,textarea,button{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;box-sizing:border-box}
button{background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.loading{display:none;margin-top:15px}
.review{border-bottom:1px solid #e5e7eb;padding:16px 0}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
<script>
window.addEventListener("DOMContentLoaded",()=>{
 const form=document.querySelector("form");
 const btn=document.getElementById("fetchBtn");
 const load=document.getElementById("loading");
 if(form){
   form.addEventListener("submit",()=>{
      btn.disabled=true;
      btn.innerText="Fetching Reviews...";
      load.style.display="block";
   });
 }
});
</script>
</head>
<body>
<div class="container">
<h1>Reviews Nest</h1>

<form method="POST">
<div class="grid">
<div>
<label>Package ID / Play Store Link</label>
<input type="text" name="package" value="{{ package if package else '' }}" required>
</div>

<div>
<label>Date</label>
<input type="date" name="date" value="{{ request.form.get('date','') }}" required>
</div>

<div class="full">
<label>Rating</label>
<select name="rating">
<option value="">All Ratings</option>
<option value="5">5 Star</option>
<option value="4">4 Star</option>
<option value="3">3 Star</option>
<option value="2">2 Star</option>
<option value="1">1 Star</option>
</select>
</div>

<div class="full">
<label>Keywords</label>
<textarea name="keyword">{{ request.form.get('keyword','') }}</textarea>
</div>

<div class="full">
<button id="fetchBtn" type="submit">Fetch Reviews</button>
<div id="loading" class="loading">Fetching reviews... Please wait.</div>
</div>
</div>
</form>

{% if reviews %}
<hr>
<h2>{{ app_info.title if app_info else package }}</h2>
<p>Total Reviews: {{ reviews|length }}</p>

{% for r in reviews %}
<div class="review">
<strong>{{ r.userName }}</strong><br>
⭐ {{ r.score }}<br>
{{ r.at }}<br><br>
{{ r.content }}
</div>
{% endfor %}
{% endif %}
</div>
</body>
</html>
