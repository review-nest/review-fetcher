<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Store Review Fetcher</title>

    <!-- Clean Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- FontAwesome for Professional Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PDF Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            font-family: 'Plus Jakarta Sans', 'Roboto', sans-serif;
            padding: 30px 15px;
            color: #1e293b;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 100%;
            max-width: 680px;
        }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* ───────────── FORM CARD (existing design) ───────────── */
        .form-card {
            position: relative;
            background: #ffffff;
            padding: 28px 26px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }

        .form-title {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 22px;
            letter-spacing: -0.2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-label {
            font-size: 12.5px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-hint {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
            font-weight: 400;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background-color: #f8fafc;
            font-family: inherit;
            font-size: 13px;
            color: #1e293b;
            transition: all 0.2s ease;
        }

        .form-input::placeholder, .form-textarea::placeholder {
            color: #94a3b8;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-textarea {
            height: 64px;
            resize: none;
        }

        /* ═════════════ PHASE 1 · INPUT CONFIRMATION ═════════════ */
        .sweep-layer {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
        }
        .sweep-layer::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 45%;
            background: linear-gradient(100deg, transparent 0%, rgba(96, 165, 250, 0.16) 45%, rgba(255, 255, 255, 0.7) 55%, transparent 100%);
            transform: translateX(-110%) skewX(-18deg);
            opacity: 0;
        }
        .form-card.sweeping .sweep-layer::before {
            animation: cardSweep 0.7s cubic-bezier(.4, 0, .2, 1) forwards;
        }
        @keyframes cardSweep {
            0%   { transform: translateX(-110%) skewX(-18deg); opacity: 0; }
            15%  { opacity: 1; }
            100% { transform: translateX(260%) skewX(-18deg); opacity: 0; }
        }

        .label-icon {
            margin-right: 5px;
            font-size: 11px;
            color: #94a3b8;
            transition: color .25s ease;
        }
        .label-icon.lit {
            animation: linkGlow 0.9s ease-out;
        }
        @keyframes linkGlow {
            0%   { color: #94a3b8; transform: scale(1); filter: none; }
            35%  { color: #2563eb; transform: scale(1.35); filter: drop-shadow(0 0 6px rgba(37, 99, 235, .85)); }
            100% { color: #2563eb; transform: scale(1); filter: drop-shadow(0 0 0 rgba(37, 99, 235, 0)); }
        }

        .nudge {
            animation: nudge 1.3s ease-out;
        }
        @keyframes nudge {
            0%   { box-shadow: 0 0 0 0 rgba(37, 99, 235, .45); border-color: #2563eb; }
            100% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
        }

        /* ───────────── PRIMARY BUTTON ───────────── */
        .fetch-btn-pill {
            grid-column: span 2;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: transform .25s cubic-bezier(.34, 1.4, .64, 1), box-shadow .25s ease, background-color .3s ease;
            margin-top: 6px;
            -webkit-tap-highlight-color: transparent;
        }
        .fetch-btn-pill::after {            /* light reflection */
            content: '';
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .5), transparent);
            transform: skewX(-20deg);
            opacity: 0;
            z-index: -1;
            pointer-events: none;
        }
        .fetch-btn-pill:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.32);
        }
        .fetch-btn-pill:hover::after {
            animation: sheen .9s ease;
        }
        @keyframes sheen {
            0%   { left: -60%; opacity: 1; }
            100% { left: 130%; opacity: 1; }
        }
        .fetch-btn-pill:active {
            transform: translateY(0) scale(.985);
            box-shadow: 0 3px 8px rgba(37, 99, 235, 0.25);
        }
        .fetch-btn-pill:focus-visible {
            outline: 3px solid rgba(37, 99, 235, .4);
            outline-offset: 3px;
        }

        .btn-icon {
            position: relative;
            width: 16px; height: 16px;
            flex: none;
        }
        .btn-icon > * {
            position: absolute;
            inset: 0;
            width: 16px; height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transform: scale(.4) rotate(-40deg);
            transition: opacity .3s ease, transform .45s cubic-bezier(.34, 1.56, .64, 1);
        }
        .fetch-btn-pill[data-state="idle"] .i-search,
        .fetch-btn-pill[data-state="processing"] .i-search,
        .fetch-btn-pill[data-state="success"] .i-check,
        .fetch-btn-pill[data-state="error"] .i-retry {
            opacity: 1;
            transform: none;
        }
        .fetch-btn-pill[data-state="processing"] .i-search {
            animation: lensOrbit 1.2s ease-in-out infinite;
        }
        @keyframes lensOrbit {
            0%, 100% { transform: translate(-2px, 1px) rotate(-10deg) scale(1); }
            50%      { transform: translate(2px, -2px) rotate(12deg) scale(1.12); }
        }
        .i-check path {
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            transition: stroke-dashoffset .45s ease .2s;
        }
        .fetch-btn-pill[data-state="success"] .i-check path { stroke-dashoffset: 0; }

        .fetch-btn-pill.is-busy {
            cursor: progress;
            background: linear-gradient(110deg, #2563eb 0%, #4f46e5 45%, #2563eb 100%);
            background-size: 220% 100%;
            animation: gradShift 2.2s linear infinite;
            transform: none;
        }
        @keyframes gradShift {
            from { background-position: 0% 0; }
            to   { background-position: -220% 0; }
        }
        .fetch-btn-pill[data-state="success"] {
            background: #059669;
            box-shadow: 0 6px 16px rgba(5, 150, 105, .3);
        }
        .fetch-btn-pill[data-state="error"] {
            background: #dc2626;
            box-shadow: 0 6px 16px rgba(220, 38, 38, .28);
        }
        .btn-label.swap { animation: labelSwap .3s ease; }
        @keyframes labelSwap {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: none; }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .5);
            transform: scale(0);
            animation: ripple .65s ease-out forwards;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes ripple {
            to { transform: scale(1); opacity: 0; }
        }

        /* ═════════════ PHASE 2 · SEARCH STAGE ═════════════ */
        .stage-wrap {
            grid-column: span 2;
            display: grid;
            grid-template-rows: 0fr;
            margin-top: -16px;               /* cancels grid gap while closed */
            transition: grid-template-rows .55s cubic-bezier(.22, 1, .36, 1), margin-top .55s cubic-bezier(.22, 1, .36, 1);
        }
        .stage-wrap.open {
            grid-template-rows: 1fr;
            margin-top: 0;
        }
        .stage-clip {
            min-height: 0;
            overflow: hidden;
        }
        .stage {
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity .4s ease .1s, transform .5s cubic-bezier(.22, 1, .36, 1) .1s;
        }
        .stage-wrap.open .stage { opacity: 1; transform: none; }

        .stage-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 24px;
        }
        .stage-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            font-weight: 500;
            color: #334155;
        }
        .pulse-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #2563eb;
            animation: dotPulse 1.4s ease-out infinite;
        }
        .stage[data-phase="4"] .pulse-dot { background: #16a34a; animation: none; }
        @keyframes dotPulse {
            0%   { box-shadow: 0 0 0 0 rgba(37, 99, 235, .5); }
            100% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
        }
        .count-chip {
            font-size: 12px;
            color: #475569;
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 999px;
            padding: 3px 11px;
            opacity: 0;
            transform: scale(.85);
            transition: opacity .3s ease, transform .5s cubic-bezier(.34, 1.56, .64, 1);
            font-variant-numeric: tabular-nums;
        }
        .count-chip b { color: #2563eb; font-weight: 600; display: inline-block; min-width: 1ch; }
        .stage.found .count-chip { opacity: 1; transform: none; }

        .stack-scene {
            position: relative;
            height: 128px;
            margin: 6px 0 4px;
            perspective: 700px;
        }
        .stack-track {
            position: absolute;
            left: 4px; right: 4px; top: 0; bottom: 0;
            transform-style: preserve-3d;
        }

        .ghost {
            position: absolute;
            top: 22px;
            left: calc(var(--i) * 34px);
            width: min(54%, 270px);
            height: 90px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #dbe3ef;
            background: rgba(255, 255, 255, calc(.92 - var(--i) * .1));
            box-shadow: 0 10px 22px rgba(37, 99, 235, .08);
            transform-origin: left center;
            transform: translateZ(calc(var(--i) * -26px)) rotateY(-14deg) rotateX(4deg);
            animation: ghostLift 1.7s ease-in-out infinite alternate;
            animation-delay: calc(var(--i) * .16s);
        }
        @keyframes ghostLift {
            from { transform: translateZ(calc(var(--i) * -26px)) rotateY(-14deg) rotateX(4deg) translateY(0); }
            to   { transform: translateZ(calc(var(--i) * -26px + 10px)) rotateY(-10deg) rotateX(2deg) translateY(-6px); }
        }
        .ghost-row { display: flex; align-items: center; gap: 8px; }
        .g-av {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #bfdbfe, #c7d2fe);
            flex: none;
        }
        .g-line {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s linear infinite;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }
        .g-line.w1 { width: 45%; }
        .g-line.w2 { width: 100%; margin-top: 9px; }
        .g-line.w3 { width: 72%; margin-top: 7px; }
        .g-stars { display: flex; gap: 3px; margin-top: 10px; }
        .g-stars i {
            font-size: 8px;
            color: #cbd5e1;
            animation: starPop 1.7s ease-in-out infinite;
            animation-delay: calc(var(--k) * .12s);
        }
        @keyframes starPop {
            0%, 100% { transform: scale(1); color: #cbd5e1; }
            40%      { transform: scale(1.5); color: #01875f; }
        }

        .sweeper {
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 44px;
            z-index: 5;
            transform: translateZ(40px);
            animation: sweep 1.7s cubic-bezier(.45, .05, .35, 1) infinite alternate;
            animation-play-state: paused;
        }
        .stage.searching .sweeper { animation-play-state: running; }
        .stage-wrap.open .sweeper { will-change: transform; }
        @keyframes sweep {
            from { transform: translateX(0) translateZ(40px); }
            to   { transform: translateX(var(--sweep, 200px)) translateZ(40px); }
        }
        .scan-line {
            position: absolute;
            left: 21px; top: 0; bottom: 0;
            width: 2px;
            border-radius: 2px;
            background: linear-gradient(180deg, transparent, #22d3ee 20%, #2563eb 60%, transparent);
            box-shadow: 0 0 12px 2px rgba(34, 211, 238, .55);
            transition: opacity .5s ease;
        }
        .lens {
            position: absolute;
            top: 4px; left: 0;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid #2563eb;
            background: radial-gradient(circle at 30% 28%, #ffffff 0%, #dbeafe 70%);
            box-shadow: 0 8px 18px rgba(37, 99, 235, .3);
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: border-color .4s ease, color .4s ease, background .4s ease;
        }
        .lens .l-glass, .lens .l-check { position: absolute; transition: opacity .3s ease, transform .45s cubic-bezier(.34, 1.56, .64, 1); }
        .lens .l-check { opacity: 0; transform: scale(.3) rotate(-30deg); }
        .lens .l-check path { stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .5s ease .15s; }
        .stage.found .scan-line { opacity: 0; }
        .stage.found .lens {
            border-color: #16a34a;
            color: #16a34a;
            background: radial-gradient(circle at 30% 28%, #ffffff 0%, #dcfce7 70%);
        }
        .stage.found .lens .l-glass { opacity: 0; transform: scale(.3); }
        .stage[data-phase="4"] .lens .l-check { opacity: 1; transform: none; }
        .stage[data-phase="4"] .lens .l-check path { stroke-dashoffset: 0; }

        .spark {
            position: absolute;
            font-size: 11px;
            color: #38bdf8;
            opacity: 0;
            animation: sparkle 1.9s ease-in-out infinite;
            animation-delay: calc(var(--s) * .38s);
        }
        .spark.s1 { top: 6px;  left: 44%; }
        .spark.s2 { top: 18px; left: 66%; }
        .spark.s3 { top: 2px;  left: 82%; }
        .spark.s4 { top: 40px; left: 91%; }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
            45%      { opacity: 1; transform: scale(1.1) rotate(25deg); }
            70%      { opacity: .6; transform: scale(.9) rotate(40deg); }
        }
        .stage.found .spark {
            color: #01875f;
            animation: sparkIn .55s cubic-bezier(.34, 1.56, .64, 1) forwards;
            animation-delay: calc(var(--s) * .12s);
        }
        @keyframes sparkIn {
            from { opacity: 0; transform: scale(.2) rotate(-30deg); }
            to   { opacity: 1; transform: scale(1) rotate(0); }
        }

        /* criteria chips (phase 1 confirmation) */
        .criteria {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0 12px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            max-width: 100%;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #dbe3ef;
            font-size: 11.5px;
            color: #334155;
            opacity: 0;
            transform: translateY(6px) scale(.95);
            animation: chipIn .45s cubic-bezier(.34, 1.45, .64, 1) forwards;
            animation-delay: calc(var(--c) * 90ms);
        }
        .chip i { color: #2563eb; font-size: 10.5px; }
        .chip span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 190px;
        }
        @keyframes chipIn { to { opacity: 1; transform: none; } }

        /* real-state progress track */
        .phase-track {
            display: flex;
            align-items: flex-start;
            list-style: none;
        }
        .pt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 78px;
            flex: none;
        }
        .pt-dot {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .35s ease, border-color .35s ease;
        }
        .pt-dot svg path {
            stroke-dasharray: 16;
            stroke-dashoffset: 16;
            transition: stroke-dashoffset .4s ease .15s;
        }
        .pt-label {
            font-size: 10.5px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.25;
            transition: color .3s ease;
        }
        .pt.active .pt-dot {
            border-color: #2563eb;
            animation: ringPulse 1.5s ease-out infinite;
        }
        .pt.active .pt-label { color: #1e293b; }
        .pt.done .pt-dot { background: #16a34a; border-color: #16a34a; }
        .pt.done .pt-dot svg path { stroke-dashoffset: 0; }
        .pt.done .pt-label { color: #475569; }
        @keyframes ringPulse {
            0%   { box-shadow: 0 0 0 0 rgba(37, 99, 235, .45); }
            100% { box-shadow: 0 0 0 9px rgba(37, 99, 235, 0); }
        }
        .pt-line {
            flex: 1;
            height: 3px;
            margin-top: 9.5px;
            border-radius: 2px;
            background: #e2e8f0;
            overflow: hidden;
        }
        .pt-line i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #22d3ee);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .6s cubic-bezier(.22, 1, .36, 1);
        }
        .pt-line.fill i { transform: scaleX(1); }

        /* ═════════════ RESULTS (existing toolbar + modal card) ═════════════ */
        #results-slot { scroll-margin-top: 12px; }
        .results-reveal {
            opacity: 0;
            transform: translateY(22px);
            transition: opacity .6s ease, transform .8s cubic-bezier(.22, 1, .36, 1);
        }
        .results-reveal.show { opacity: 1; transform: none; }

        .result-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px 16px;
            background: #ffffff;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 12px;
        }
        .rs-main { display: flex; align-items: center; gap: 8px; }
        .rs-count {
            font-size: 22px;
            font-weight: 600;
            color: #2563eb;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .rs-label { font-size: 13px; color: #475569; }
        .rs-tick {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #16a34a;
            display: flex; align-items: center; justify-content: center;
            transform: scale(0);
            transition: transform .5s cubic-bezier(.34, 1.56, .64, 1);
        }
        .rs-tick path { stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset .4s ease .25s; }
        .settled .rs-tick { transform: scale(1); }
        .settled .rs-tick path { stroke-dashoffset: 0; }
        .rs-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .rs-chips .chip { opacity: 1; transform: none; animation: none; background: #f8fafc; }

        .action-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 16px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        /* Premium Compact Action Buttons */
        .premium-btn {
            padding: 6px 14px;
            font-size: 11.5px;
            font-weight: 500;
            border-radius: 16px;
            border: none;
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .pdf-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .pdf-btn:hover {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            transform: translateY(-1px);
        }

        .play-modal-card {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #dadce0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            transition: box-shadow .8s ease;
        }
        .settled .play-modal-card {
            animation: settleGlow 1.1s ease-out;
            box-shadow: 0 14px 34px rgba(37, 99, 235, 0.10);
        }
        @keyframes settleGlow {
            0%   { box-shadow: 0 0 0 0 rgba(22, 163, 74, .35), 0 4px 20px rgba(0, 0, 0, .06); }
            100% { box-shadow: 0 0 0 14px rgba(22, 163, 74, 0), 0 14px 34px rgba(37, 99, 235, .10); }
        }

        .modal-header {
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-logo {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            object-fit: cover;
        }

        .modal-app-title {
            font-size: 15px;
            font-weight: 500;
            color: #202124;
            line-height: 1.25;
        }

        .modal-app-sub {
            font-size: 12px;
            color: #5f6368;
            margin-top: 1px;
            font-weight: 400;
        }

        .modal-close-icon {
            font-size: 18px;
            color: #5f6368;
            cursor: pointer;
        }

        .reviews-list {
            padding: 8px 20px 20px 20px;
        }

        .ps-review-item {
            padding: 14px 0;
            border-bottom: 1px solid #f1f3f4;
        }

        .ps-review-item:last-child {
            border-bottom: none;
        }

        /* PHASE 3 · staggered card entrance */
        .ps-review-item.rv-enter {
            opacity: 0;
            transform: translateY(16px) scale(.985);
        }
        .ps-review-item.rv-in {
            opacity: 1;
            transform: none;
            transition: opacity .5s ease, transform .75s cubic-bezier(.34, 1.45, .64, 1);
        }
        .ps-stars i { display: inline-block; }
        .stars-pending { opacity: .2; }
        .stars-pending i { opacity: .2; transform: scale(.4); }
        .stars-lit { opacity: 1; transition: opacity .4s ease; }
        .stars-lit i {
            opacity: 1;
            transform: none;
            transition: opacity .3s ease, transform .5s cubic-bezier(.34, 1.8, .64, 1);
            transition-delay: calc(var(--k, 0) * 70ms);
        }

        .ps-user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ps-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .avatar-img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .ps-username {
            font-size: 13px;
            font-weight: 400;
            color: #202124;
        }

        .ps-three-dots {
            color: #5f6368;
            font-size: 14px;
        }

        .ps-rating-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .ps-stars {
            color: #01875f;
            font-size: 10.5px;
            letter-spacing: 0.5px;
        }

        .ps-date {
            font-size: 11px;
            color: #5f6368;
            font-weight: 400;
        }

        .ps-comment {
            font-size: 12.5px;
            color: #3c4043;
            margin: 6px 0 10px 0;
            line-height: 1.5;
            font-weight: 400;
            word-break: break-word;
        }

        .ps-helpful-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ps-helpful-text {
            font-size: 11.5px;
            color: #5f6368;
            font-weight: 400;
        }

        .ps-action-btns {
            display: flex;
            gap: 8px;
        }

        .ps-pill-btn {
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 16px;
            padding: 3px 15px;
            font-size: 11px;
            color: #3c4043;
            cursor: pointer;
            font-weight: 400;
        }

        /* ═════════════ PHASE 5 · EMPTY / ERROR STATES ═════════════ */
        .state-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 34px 24px 28px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
        }
        .state-art {
            width: 124px;
            margin: 0 auto 14px;
            animation: floaty 3.6s ease-in-out infinite;
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        .state-title {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .state-body {
            font-size: 13px;
            color: #64748b;
            line-height: 1.55;
            max-width: 390px;
            margin: 0 auto 18px;
        }
        .state-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .state-card .premium-btn { padding: 9px 18px; font-size: 12.5px; }
        .retry-btn { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .retry-btn:hover { transform: translateY(-1px); background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
        .ghost-btn {
            background: #ffffff;
            color: #334155;
            border: 1px solid #cbd5e1;
            box-shadow: none;
        }
        .ghost-btn:hover { background: #f8fafc; transform: translateY(-1px); }
        .premium-btn:focus-visible { outline: 3px solid rgba(37, 99, 235, .4); outline-offset: 2px; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width, .fetch-btn-pill, .stage-wrap { grid-column: span 1; }
            .form-card { padding: 22px 18px; }
            .pt { width: 64px; }
            .pt-label { font-size: 10px; }
            .stack-scene { height: 120px; }
            .ghost { height: 84px; }
        }

        /* Respect reduced-motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                animation-delay: 0s !important;
                transition-duration: .01ms !important;
                transition-delay: 0s !important;
                scroll-behavior: auto !important;
            }
            .ghost { transform: translateZ(calc(var(--i) * -26px)) rotateY(-14deg) rotateX(4deg); }
            .chip { opacity: 1; transform: none; }
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        <div class="form-card" id="form-card">
            <div class="sweep-layer" aria-hidden="true"></div>
            <div class="form-title">Play Store Reviews Fetcher</div>

            <form method="POST" id="review-form">
                <div class="form-grid">

                    <div class="form-group">
                        <label class="form-label" for="f-package"><i class="fa-solid fa-link label-icon" id="link-icon" aria-hidden="true"></i>Application Package ID / URL</label>
                        <input
                            type="text"
                            class="form-input"
                            id="f-package"
                            name="package"
                            placeholder="e.g., com.example or https://play.google.com/store/apps/details?id=..."
                            value=""
                            required>
                        <span class="form-hint">Enter the Package ID or paste the complete Play Store link.</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="f-date">Review Date</label>
                        <input
                            type="date"
                            class="form-input"
                            id="f-date"
                            name="date"
                            value=""
                            required>
                        <span class="form-hint">Select the target review publication date.</span>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label" for="f-rating">Filter Rating</label>
                        <select class="form-select" id="f-rating" name="rating">
                            <option value="" selected>All Ratings</option>
                            <option value="5" >★ ★ ★ ★ ★ (5 Stars)</option>
                            <option value="4" >★ ★ ★ ★ ☆ (4 Stars)</option>
                            <option value="3" >★ ★ ★ ☆ ☆ (3 Stars)</option>
                            <option value="2" >★ ★ ☆ ☆ ☆ (2 Stars)</option>
                            <option value="1" >★ ☆ ☆ ☆ ☆ (1 Star)</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label" for="f-keyword">Search Keywords</label>
                        <textarea
                            class="form-textarea"
                            id="f-keyword"
                            name="keyword"
                            placeholder="Enter keywords (e.g. refund, update, crash) - 1 per line"></textarea>
                        <span class="form-hint">Filter reviews containing specific terms. Add one keyword per line.</span>
                    </div>

                    <button type="submit" class="fetch-btn-pill" id="fetch-btn" data-state="idle">
                        <span class="btn-icon" aria-hidden="true">
                            <i class="fa-solid fa-magnifying-glass i-search"></i>
                            <svg class="i-check" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 4.8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <i class="fa-solid fa-rotate-right i-retry"></i>
                        </span>
                        <span class="btn-label">Fetch Reviews</span>
                    </button>

                    <!-- Phases 1-3 live stage: opens below the button -->
                    <div class="stage-wrap" id="stage-wrap">
                        <div class="stage-clip">
                            <div class="stage" id="stage" data-phase="1" aria-hidden="true">
                                <div class="stage-head">
                                    <div class="stage-status"><span class="pulse-dot"></span><span id="stage-status">Confirming your criteria</span></div>
                                    <div class="count-chip"><b data-count>0</b> found</div>
                                </div>

                                <div class="stack-scene">
                                    <div class="stack-track" id="stack-track">
                                        <!-- floating stack of translucent review cards -->
                                        <div class="ghost" style="--i:3"><div class="ghost-row"><span class="g-av"></span><span class="g-line w1"></span></div><div class="g-line w2"></div><div class="g-line w3"></div><div class="g-stars"><i class="fa-solid fa-star" style="--k:0"></i><i class="fa-solid fa-star" style="--k:1"></i><i class="fa-solid fa-star" style="--k:2"></i><i class="fa-solid fa-star" style="--k:3"></i><i class="fa-solid fa-star" style="--k:4"></i></div></div>
                                        <div class="ghost" style="--i:2"><div class="ghost-row"><span class="g-av"></span><span class="g-line w1"></span></div><div class="g-line w2"></div><div class="g-line w3"></div><div class="g-stars"><i class="fa-solid fa-star" style="--k:0"></i><i class="fa-solid fa-star" style="--k:1"></i><i class="fa-solid fa-star" style="--k:2"></i><i class="fa-solid fa-star" style="--k:3"></i><i class="fa-solid fa-star" style="--k:4"></i></div></div>
                                        <div class="ghost" style="--i:1"><div class="ghost-row"><span class="g-av"></span><span class="g-line w1"></span></div><div class="g-line w2"></div><div class="g-line w3"></div><div class="g-stars"><i class="fa-solid fa-star" style="--k:0"></i><i class="fa-solid fa-star" style="--k:1"></i><i class="fa-solid fa-star" style="--k:2"></i><i class="fa-solid fa-star" style="--k:3"></i><i class="fa-solid fa-star" style="--k:4"></i></div></div>
                                        <div class="ghost" style="--i:0"><div class="ghost-row"><span class="g-av"></span><span class="g-line w1"></span></div><div class="g-line w2"></div><div class="g-line w3"></div><div class="g-stars"><i class="fa-solid fa-star" style="--k:0"></i><i class="fa-solid fa-star" style="--k:1"></i><i class="fa-solid fa-star" style="--k:2"></i><i class="fa-solid fa-star" style="--k:3"></i><i class="fa-solid fa-star" style="--k:4"></i></div></div>

                                        <i class="fa-solid fa-star spark s1" style="--s:0"></i>
                                        <i class="fa-solid fa-star spark s2" style="--s:1"></i>
                                        <i class="fa-solid fa-star spark s3" style="--s:2"></i>
                                        <i class="fa-solid fa-star spark s4" style="--s:3"></i>

                                        <!-- magnifier + luminous scan line -->
                                        <div class="sweeper">
                                            <span class="scan-line"></span>
                                            <span class="lens">
                                                <i class="fa-solid fa-magnifying-glass l-glass"></i>
                                                <svg class="l-check" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div class="criteria" id="criteria"></div>

                                <ol class="phase-track">
                                    <li class="pt"><span class="pt-dot"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.3l2.5 2.5L10 3.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="pt-label">Inputs confirmed</span></li>
                                    <li class="pt-line"><i></i></li>
                                    <li class="pt"><span class="pt-dot"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.3l2.5 2.5L10 3.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="pt-label">Searching reviews</span></li>
                                    <li class="pt-line"><i></i></li>
                                    <li class="pt"><span class="pt-dot"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.3l2.5 2.5L10 3.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="pt-label">Results received</span></li>
                                </ol>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </div>

        <!-- Screen-reader announcements for every phase -->
        <div class="sr-only" role="status" aria-live="polite" id="sr-status"></div>

        <!-- Phases 3-5 render here: results, empty state or error state -->
        <div id="results-slot"></div>

    </div>

    <script>
        /* ───────────── PDF export (unchanged) ───────────── */
        function exportToPDF() {
            const element = document.getElementById('export-target');
            if(!element) return;

            const opt = {
                margin:       8,
                filename:     `PlayStore_Reviews_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        /* ═══════════════════════════════════════════════════════════
           REVIEW SEARCH ANIMATION — 5 PHASES
           Every phase is driven by a real state: the form values, the
           actual network request, and the actual reviews returned.
           No fake progress, counts or reviews are ever generated.
           ═══════════════════════════════════════════════════════════ */
        (() => {
            const $  = (s, r = document) => r.querySelector(s);
            const $$ = (s, r = document) => [...r.querySelectorAll(s)];

            const form      = $('#review-form');
            const formCard  = $('#form-card');
            const btn       = $('#fetch-btn');
            const btnLabel  = $('.btn-label', btn);
            const stage     = $('#stage');
            const stageWrap = $('#stage-wrap');
            const slot      = $('#results-slot');
            const srStatus  = $('#sr-status');
            const linkIcon  = $('#link-icon');
            const critBox   = $('#criteria');
            const track     = $('#stack-track');
            const pts       = $$('.pt', stage);
            const lines     = $$('.pt-line', stage);

            const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));
            const raf2  = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

            let busy = false;
            let idleTimer = null;
            let closeTimer = null;

            /* ───────────── helpers ───────────── */
            function el(tag, cls, text) {
                const n = document.createElement(tag);
                if (cls) n.className = cls;
                if (text != null) n.textContent = text;
                return n;
            }
            function say(msg) { srStatus.textContent = msg; }
            function stageText(msg) { $('#stage-status').textContent = msg; }
            function measure() {
                stage.style.setProperty('--sweep', Math.max(0, track.clientWidth - 44) + 'px');
            }
            window.addEventListener('resize', measure);

            function setBtn(state, label) {
                btn.dataset.state = state;
                btn.classList.toggle('is-busy', state === 'processing');
                btn.setAttribute('aria-busy', state === 'processing' ? 'true' : 'false');
                if (btnLabel.textContent !== label) {
                    btnLabel.textContent = label;
                    btnLabel.classList.remove('swap');
                    void btnLabel.offsetWidth;
                    btnLabel.classList.add('swap');
                }
            }

            function setPhase(n) {
                stage.dataset.phase = n;
                pts.forEach((p, i) => {
                    p.classList.toggle('done', n > i + 1);
                    p.classList.toggle('active', n === i + 1);
                });
                lines.forEach((l, i) => l.classList.toggle('fill', n > i + 1));
            }

            function countTo(n, dur = 750) {
                const els = $$('[data-count]');
                if (REDUCED || n === 0) {
                    els.forEach(e => e.textContent = n);
                    return Promise.resolve();
                }
                return new Promise(resolve => {
                    const t0 = performance.now();
                    (function tick(t) {
                        const p = Math.min(1, (t - t0) / dur);
                        const v = Math.round(n * (1 - Math.pow(1 - p, 3)));
                        els.forEach(e => e.textContent = v);
                        p < 1 ? requestAnimationFrame(tick) : resolve();
                    })(t0);
                });
            }

            function openStage()  { clearTimeout(closeTimer); stageWrap.classList.add('open'); }
            function closeStage() { stageWrap.classList.remove('open'); }

            /* ───────────── ripple on the button ───────────── */
            btn.addEventListener('pointerdown', e => {
                const r = btn.getBoundingClientRect();
                const size = Math.max(r.width, r.height) * 2;
                const s = el('span', 'ripple');
                s.style.width = s.style.height = size + 'px';
                s.style.left = (e.clientX - r.left - size / 2) + 'px';
                s.style.top  = (e.clientY - r.top  - size / 2) + 'px';
                btn.appendChild(s);
                s.addEventListener('animationend', () => s.remove());
            });

            /* ───────────── read the criteria the user chose ───────────── */
            function readCriteria() {
                const fd  = new FormData(form);
                const raw = String(fd.get('package') || '').trim();
                const m   = raw.match(/[?&]id=([\w.]+)/);
                const kws = String(fd.get('keyword') || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
                const d   = fd.get('date');
                return {
                    pkg: m ? m[1] : raw,
                    date: d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '',
                    rating: fd.get('rating') ? fd.get('rating') + (fd.get('rating') === '1' ? ' star' : ' stars') : 'All ratings',
                    kws: kws.length ? kws.length + (kws.length === 1 ? ' keyword' : ' keywords') : 'No keyword filter'
                };
            }
            function chipList(c) {
                return [
                    ['fa-link', c.pkg],
                    ['fa-calendar-days', c.date],
                    ['fa-star', c.rating],
                    ['fa-filter', c.kws]
                ];
            }
            function buildChip(icon, text, i) {
                const chip = el('div', 'chip');
                chip.style.setProperty('--c', i);
                chip.append(el('i', 'fa-solid ' + icon), el('span', null, text));
                return chip;
            }

            /* ═════════ PHASE 1 — INPUT CONFIRMATION ═════════ */
            async function phase1(c) {
                setBtn('processing', 'Confirming…');
                say('Confirming your search criteria.');
                stageText('Confirming your criteria');

                // light sweep across the input card
                formCard.classList.remove('sweeping');
                void formCard.offsetWidth;
                formCard.classList.add('sweeping');

                // link icon illuminates
                linkIcon.classList.remove('lit');
                void linkIcon.offsetWidth;
                linkIcon.classList.add('lit');

                // stage opens and the criteria are confirmed as chips
                critBox.replaceChildren(...chipList(c).map(([ic, t], i) => buildChip(ic, t, i)));
                setPhase(1);
                openStage();
                await sleep(520);
            }

            /* ═════════ PHASE 2 — SEARCH INITIATION ═════════
               Lens sweeps across the translucent stack for as long as the
               real request is in flight (minimum ~0.8s so it is perceivable). */
            async function phase2(requestPromise) {
                setPhase(2);
                stage.classList.add('searching');
                setBtn('processing', 'Searching…');
                stageText('Searching reviews');
                say('Searching for reviews.');
                const [res] = await Promise.all([requestPromise, sleep(800)]);
                return res;
            }

            /* ═════════ network (the only source of review data) ═════════ */
            async function request(signal) {
                const body = new URLSearchParams();
                for (const [k, v] of new FormData(form)) body.append(k, v);
                const res = await fetch(form.getAttribute('action') || window.location.href, {
                    method: 'POST',
                    body,
                    signal,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                if (!res.ok) { const e = new Error('http'); e.status = res.status; throw e; }
                return res.text();
            }

            function parseResponse(html) {
                const doc = new DOMParser().parseFromString(html, 'text/html');
                $$('script', doc).forEach(s => s.remove());
                const errNode = doc.querySelector('.error-message, .alert-error, [data-error]');
                return {
                    serverError: errNode ? errNode.textContent.trim() : '',
                    toolbar: doc.querySelector('.action-toolbar'),
                    target:  doc.querySelector('#export-target'),
                    items:   $$('.ps-review-item', doc)
                };
            }

            /* Mount the real server markup (toolbar + card) under the form */
            function mountResults(p, c) {
                const wrap = el('div', 'results-reveal');

                const summary = el('div', 'result-summary');
                const main = el('div', 'rs-main');
                main.append(el('span', 'rs-count', '0'));
                main.firstChild.setAttribute('data-count', '');
                const label = el('span', 'rs-label', p.items.length === 1 ? 'review found' : 'reviews found');
                const tick = el('span', 'rs-tick');
                tick.innerHTML = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6.3l2.5 2.5L10 3.2" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                main.append(label, tick);
                const chips = el('div', 'rs-chips');
                chipList(c).forEach(([ic, t], i) => chips.append(buildChip(ic, t, i)));
                summary.append(main, chips);
                wrap.append(summary);

                if (p.toolbar) wrap.append(document.importNode(p.toolbar, true));
                if (p.target) {
                    wrap.append(document.importNode(p.target, true));
                } else {
                    const t = el('div'); t.id = 'export-target';
                    const card = el('div', 'play-modal-card');
                    const list = el('div', 'reviews-list');
                    p.items.forEach(i => list.append(document.importNode(i, true)));
                    card.append(list); t.append(card); wrap.append(t);
                }
                slot.replaceChildren(wrap);
                return { wrap, items: $$('.ps-review-item', wrap) };
            }

            /* ═════════ PHASE 3 — REVIEW DISCOVERY ═════════
               Cards rise in one by one, stars light up in sequence,
               and the counter ticks up to the real number returned. */
            async function phase3(p, c) {
                const n = p.items.length;
                stage.classList.remove('searching');
                stage.classList.add('found');
                setPhase(3);
                setBtn('processing', 'Receiving…');
                stageText(`Receiving ${n} review${n === 1 ? '' : 's'}`);
                say(`${n} review${n === 1 ? '' : 's'} received.`);

                const { wrap, items } = mountResults(p, c);

                // prime cards (hidden, but still occupying space → no layout shift)
                items.forEach(it => {
                    it.classList.add('rv-enter');
                    const st = $('.ps-stars', it);
                    if (st) {
                        st.classList.add('stars-pending');
                        $$('i', st).forEach((s, k) => s.style.setProperty('--k', k));
                    }
                });

                await raf2();
                wrap.classList.add('show');
                wrap.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });

                const STAGGER = 85, MAX = 14;   // only the first screenful is staggered (performance)
                items.forEach((it, i) => {
                    const delay = Math.min(i, MAX) * STAGGER;
                    it.style.transitionDelay = REDUCED ? '0s' : delay + 'ms';
                    it.classList.add('rv-in');
                    const st = $('.ps-stars', it);
                    if (st) {
                        setTimeout(() => {
                            st.classList.remove('stars-pending');
                            st.classList.add('stars-lit');
                        }, REDUCED ? 0 : delay + 260);
                    }
                });

                const total = Math.min(items.length, MAX) * STAGGER + 950;
                await Promise.all([countTo(n), sleep(total)]);

                // cleanup transient classes so normal hover/layout behaviour returns
                items.forEach(it => {
                    it.classList.remove('rv-enter', 'rv-in');
                    it.style.transitionDelay = '';
                    const st = $('.ps-stars', it);
                    if (st) { st.classList.remove('stars-lit', 'stars-pending'); $$('i', st).forEach(s => s.style.removeProperty('--k')); }
                });
                return { wrap, n };
                            }

            * ═════════ PHASE 4 — SUCCESS STATE ═════════ */
            async function phase4(wrap, n) {
                setPhase(4);
                wrap.classList.add('settled');
                stageText(`${n} review${n === 1 ? '' : 's'} found`);
                setBtn('success', `${n} review${n === 1 ? '' : 's'} found`);
                say(`Search complete. ${n} review${n === 1 ? '' : 's'} found.`);
                busy = false;

                closeTimer = setTimeout(closeStage, REDUCED ? 0 : 1700);
                idleTimer  = setTimeout(() => setBtn('idle', 'Fetch Reviews'), REDUCED ? 0 : 2600);
            }

            /* ═════════ PHASE 5 — EMPTY & ERROR STATES ═════════ */
            const ART_EMPTY = `
                <svg viewBox="0 0 124 100" fill="none" aria-hidden="true">
                    <rect x="14" y="10" width="68" height="46" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
                    <rect x="26" y="4" width="68" height="46" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
                    <rect x="38" y="16" width="26" height="5" rx="2.5" fill="#e2e8f0"/>
                    <rect x="38" y="28" width="44" height="5" rx="2.5" fill="#e2e8f0"/>
                    <circle cx="86" cy="62" r="19" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
                    <path d="M78 62h16" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
                    <path d="M100 76l12 12" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
                </svg>`;
            const ART_ERROR = `
                <svg viewBox="0 0 124 100" fill="none" aria-hidden="true">
                    <circle cx="62" cy="50" r="38" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
                    <path d="M62 30v24" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="62" cy="68" r="3.6" fill="#dc2626"/>
                </svg>`;

            function showState(kind, title, body, actions) {
                const card = el('div', 'state-card');
                const art = el('div', 'state-art');
                art.innerHTML = kind === 'empty' ? ART_EMPTY : ART_ERROR;
                const acts = el('div', 'state-actions');
                actions.forEach(a => {
                    const b = el('button', 'premium-btn ' + a.cls);
                    b.type = 'button';
                    b.innerHTML = `<i class="fa-solid ${a.icon}"></i>`;
                    b.append(document.createTextNode(a.label));
                    b.addEventListener('click', a.fn);
                    acts.append(b);
                });
                card.append(art, el('div', 'state-title', title), el('div', 'state-body', body), acts);
                if (kind === 'error') card.setAttribute('role', 'alert');
                const wrap = el('div', 'results-reveal');
                wrap.append(card);
                slot.replaceChildren(wrap);
                requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('show')));
                wrap.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' });
            }

            function adjustFilters() {
                formCard.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' });
                $('#f-rating').focus({ preventScroll: true });
                ['#f-date', '#f-rating', '#f-keyword'].forEach(s => {
                    const n = $(s);
                    n.classList.remove('nudge');
                    void n.offsetWidth;
                    n.classList.add('nudge');
                    n.addEventListener('animationend', () => n.classList.remove('nudge'), { once: true });
                });
            }

            function phase5Empty(c) {
                setPhase(3);
                stageText('No reviews matched');
                setBtn('idle', 'Fetch Reviews');
                say('Search complete. No reviews matched these filters.');
                const bits = [c.date && `published on ${c.date}`, c.rating !== 'All ratings' && `rated ${c.rating}`, c.kws !== 'No keyword filter' && 'containing your keywords'].filter(Boolean);
                showState('empty',
                    'No reviews match these filters',
                    `Nothing was found${bits.length ? ' ' + bits.join(', ') : ''} for this app. Try another date, a different rating, or fewer keywords.`,
                    [
                        { cls: 'retry-btn', icon: 'fa-sliders', label: 'Adjust filters', fn: adjustFilters },
                        { cls: 'ghost-btn', icon: 'fa-rotate-right', label: 'Search again', fn: run }
                    ]);
                closeTimer = setTimeout(closeStage, 500);
            }

            function phase5Error(err) {
                stage.classList.remove('searching');
                stageText('Request failed');
                setBtn('error', 'Try again');
                let msg;
                if (err && err.serverMessage)         msg = err.serverMessage;
                else if (err && err.name === 'AbortError') msg = 'The request took too long and was stopped.';
                else if (err && err.status)           msg = `The review service returned an error (HTTP ${err.status}).`;
                else                                  msg = 'The review service could not be reached. Check your connection and try again.';
                say('Search failed. ' + msg);
                showState('error',
                    "Couldn't fetch reviews",
                    msg + ' Your inputs have been kept.',
                    [{ cls: 'retry-btn', icon: 'fa-rotate-right', label: 'Retry', fn: run }]);
                closeTimer = setTimeout(closeStage, 500);
            }

            /* ───────────── orchestration ───────────── */
            function resetStage() {
                clearTimeout(idleTimer); clearTimeout(closeTimer);
                stage.classList.remove('searching', 'found');
                setPhase(1);
                $$('[data-count]').forEach(e => e.textContent = '0');
                slot.replaceChildren();
            }

            async function run() {
                if (busy) return;
                busy = true;
                const c = readCriteria();
                resetStage();
                measure();

                // The request starts immediately and runs alongside phases 1-2
                const ctrl = new AbortController();
                const timeout = setTimeout(() => ctrl.abort(), 45000);
                const requestPromise = request(ctrl.signal)
                    .then(html => ({ html }), error => ({ error }))
                    .finally(() => clearTimeout(timeout));

                try {
                    await phase1(c);
                    const res = await phase2(requestPromise);

                    if (res.error) return phase5Error(res.error);

                    const parsed = parseResponse(res.html);
                    if (parsed.serverError && !parsed.items.length) {
                        return phase5Error({ serverMessage: parsed.serverError });
                    }
                    if (!parsed.items.length) return phase5Empty(c);

                    const { wrap, n } = await phase3(parsed, c);
                    await phase4(wrap, n);
                } catch (e) {
                    phase5Error(e);
                } finally {
                    busy = false;
                }
            }

            form.addEventListener('submit', e => {
                e.preventDefault();
                run();
            });
        })();
    </script>
</body>
</html>
